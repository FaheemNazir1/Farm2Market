<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Validation - Farm2Market</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 800px; margin: 0 auto; line-height: 1.6; }
        button { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 8px; }
        button:hover { background: #15803d; }
        #result { margin-top: 20px; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Validation API</h1>
    <button onclick="testRegistration()">Test Registration Validation</button>
    <button onclick="testOrderValidation()">Test Order Validation (After Login)</button>
    <div id="result">Waiting for action...</div>

    <script>
        let authToken = '';
        
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            
            const testData = {
                name: "Test User",
                email: "test" + Date.now() + "@example.com",
                password: "test123",
                phone: "9876543210",
                userType: "farmer",
                address: {
                    street: "123 Test Street",
                    city: "Test City",
                    state: "Delhi",
                    pincode: "110001"
                },
                farmDetails: {
                    farmName: "Test Farm"
                }
            };

            try {
                console.log('Testing registration with:', testData);
                
                const response = await fetch('http://localhost:5002/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });

                const responseData = await response.json();
                console.log('Registration response:', responseData);
                
                if (response.ok) {
                    authToken = responseData.token;
                }
                
                resultDiv.innerHTML = `
                    <h3>Registration Response Status: ${response.status}</h3>
                    <pre>${JSON.stringify(responseData, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Registration Error:', error);
                resultDiv.innerHTML = `<h3>Registration Error: ${error.message}</h3>`;
            }
        }

        async function testOrderValidation() {
            const resultDiv = document.getElementById('result');
            
            if (!authToken) {
                try {
                    const loginResponse = await fetch('http://localhost:5002/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: "buyer@test.com", password: "buyer123" })
                    });
                    const loginData = await loginResponse.json();
                    if (loginData.success) {
                        authToken = loginData.token;
                    } else {
                        resultDiv.innerHTML = '<h3>Please login first!</h3>';
                        return;
                    }
                } catch (error) {
                    resultDiv.innerHTML = '<h3>Login failed!</h3>';
                    return;
                }
            }
            
            const orderData = {
                items: [{
                    cropId: "1787466125938lr0dikoyh",
                    quantity: 2
                }],
                shippingAddress: {
                    name: "Test Buyer",
                    phone: "9876543210",
                    street: "123 Test Street",
                    city: "Test City",
                    state: "Delhi",
                    pincode: "110001",
                    landmark: "Near Test Market"
                },
                paymentMethod: "cod",
                notes: "Test order"
            };

            try {
                console.log('Testing order with:', orderData);
                
                const response = await fetch('http://localhost:5002/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(orderData)
                });

                const responseData = await response.json();
                console.log('Order response:', responseData);
                
                resultDiv.innerHTML = `
                    <h3>Order Response Status: ${response.status}</h3>
                    <pre>${JSON.stringify(responseData, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Order Error:', error);
                resultDiv.innerHTML = `<h3>Order Error: ${error.message}</h3>`;
            }
        }
    </script>
</body>
</html>
