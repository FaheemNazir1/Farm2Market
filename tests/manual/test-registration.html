<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration - Farm2Market</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 800px; margin: 0 auto; line-height: 1.6; }
        button { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
        button:hover { background: #15803d; }
        #result { margin-top: 20px; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Registration API</h1>
    <button onclick="testRegistration()">Test Registration</button>
    <div id="result">Waiting for action...</div>

    <script>
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            
            const testData = {
                name: "Test User",
                email: "test" + Date.now() + "@example.com",
                password: "test123",
                phone: "9876543210",
                userType: "farmer",
                address: {
                    street: "123 Test St",
                    city: "Test City",
                    state: "Delhi",
                    pincode: "110001"
                },
                farmDetails: {
                    farmName: "Test Farm"
                }
            };

            try {
                console.log('Sending registration data:', testData);
                
                const response = await fetch('http://localhost:5002/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });

                const responseData = await response.json();
                console.log('Registration response:', responseData);
                
                resultDiv.innerHTML = `
                    <h3>Response Status: ${response.status}</h3>
                    <pre>${JSON.stringify(responseData, null, 2)}</pre>
                `;
                
                if (response.ok) {
                    console.log('Registration successful!');
                } else {
                    console.error('Registration failed:', responseData);
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<h3>Error: ${error.message}</h3>`;
            }
        }
    </script>
</body>
</html>
