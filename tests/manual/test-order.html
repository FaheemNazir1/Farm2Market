<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Order Creation - Farm2Market</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 800px; margin: 0 auto; line-height: 1.6; }
        button { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 8px; }
        button:hover { background: #15803d; }
        #result { margin-top: 20px; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Order Creation API</h1>
    <p>Use these buttons to quickly test backend order creation without the UI.</p>
    <button onclick="testLogin()">1. Login as Buyer</button>
    <button onclick="testOrder()">2. Test Order Creation</button>
    <div id="result">Waiting for action...</div>

    <script>
        let authToken = '';
        
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            
            const loginData = {
                email: "buyer@test.com",
                password: "buyer123"
            };

            try {
                console.log('Logging in with:', loginData);
                
                const response = await fetch('http://localhost:5002/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });

                const responseData = await response.json();
                console.log('Login response:', responseData);
                
                if (response.ok && responseData.success) {
                    authToken = responseData.token;
                    resultDiv.innerHTML = `
                        <h3>Login Success!</h3>
                        <p>Token: ${authToken.substring(0, 20)}...</p>
                        <p>User: ${responseData.user.name}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<h3>Login Failed: ${responseData.message}</h3>`;
                }
                
            } catch (error) {
                console.error('Login Error:', error);
                resultDiv.innerHTML = `<h3>Login Error: ${error.message}</h3>`;
            }
        }

        async function testOrder() {
            const resultDiv = document.getElementById('result');
            
            if (!authToken) {
                resultDiv.innerHTML = '<h3>Please login first!</h3>';
                return;
            }
            
            const orderData = {
                items: [{
                    cropId: "1",
                    quantity: 2
                }],
                shippingAddress: {
                    name: "Test Buyer",
                    phone: "9876543210",
                    street: "123 Test Street",
                    city: "Test City",
                    state: "Delhi",
                    pincode: "110001",
                    landmark: "Near Test Market"
                },
                paymentMethod: "cod",
                notes: "Test order"
            };

            try {
                console.log('Creating order with:', orderData);
                
                const response = await fetch('http://localhost:5002/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(orderData)
                });

                const responseData = await response.json();
                console.log('Order response:', responseData);
                
                resultDiv.innerHTML = `
                    <h3>Order Response Status: ${response.status}</h3>
                    <pre>${JSON.stringify(responseData, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Order Error:', error);
                resultDiv.innerHTML = `<h3>Order Error: ${error.message}</h3>`;
            }
        }
    </script>
</body>
</html>
